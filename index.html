<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardGenr Interface</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #0d0d0d; color: #00ff66; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; border: 1px solid #00ff66; padding: 20px; background: #121212; box-shadow: 0 0 15px rgba(0,255,102,0.2); }
        h1 { text-align: center; margin-bottom: 20px; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
        input, button { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #00ff66; color: #00ff66; font-size: 1rem; }
        button { cursor: pointer; background: #00ff66; color: #0d0d0d; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        button:hover { background: #00cc52; }
        pre { background: #000; padding: 15px; border: 1px dashed #00ff66; margin-top: 20px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; word-wrap: break-word; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CardGenr Terminal GUI</h1>
        <div class="form-group">
            <label for="endpoint">API Endpoint</label>
            <input type="text" id="endpoint" value="https://cardgenr.com/api/v1">
        </div>
        <div class="form-group">
            <label for="apikey">API Key / Token</label>
            <input type="password" id="apikey" placeholder="Enter key if required...">
        </div>
        <button id="fetchBtn">Execute Request</button>
        <pre id="output">Output stream ready...</pre>
    </div>

    <script>
        document.getElementById('fetchBtn').addEventListener('click', async () => {
            const url = document.getElementById('endpoint').value;
            const key = document.getElementById('apikey').value;
            const output = document.getElementById('output');
            
            output.textContent = 'Scurrying across network...';
            try {
                const headers = { 'Content-Type': 'application/json' };
                if (key) headers['Authorization'] = `Bearer ${key}`;

                const response = await fetch(url, { method: 'GET', headers });
                const text = await response.text();
                
                try {
                    const json = JSON.parse(text);
                    output.textContent = JSON.stringify(json, null, 2);
                } catch {
                    output.textContent = text;
                }
            } catch (err) {
                output.textContent = `Error: ${err.message}`;
            }
        });
    </script>
</body>
</html>
